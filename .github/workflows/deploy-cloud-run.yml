name: Build and Deploy Box MCP Server to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to GCP
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout repository code (Updated to v5)
      - name: Checkout Code
        uses: actions/checkout@v5

      # 2. Authenticate to GCP using Workload Identity Federation (Keyless)
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/373951769736/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gh-actions-deployer@inala-development-project.iam.gserviceaccount.com'

      # 3. Set up Google Cloud SDK (Updated to v3)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # 4. Authorize Docker for GCP Artifact Registry
      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # 5. Build and Submit Container Image via Cloud Build
      - name: Build and Push Image
        env:
          GCP_PROJECT_ID: 'inala-development-project'
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/mcp-repo/box-mcp-server:${{ github.sha }}"
          
          # Submit build asynchronously so Cloud Build compiles and pushes to Artifact Registry
          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --tag "$IMAGE_TAG" \
            --async
          
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID" >> $GITHUB_ENV

      # 6. Deploy Container to Cloud Run
      - name: Deploy Container to Cloud Run
        run: |
          gcloud run deploy box-mcp-server \
            --project "inala-development-project" \
            --image "${{ env.IMAGE_TAG }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300s \
            --set-env-vars BOX_AUTH_TYPE=ccg,BOX_SUBJECT_TYPE=enterprise \
            --set-secrets "BOX_CLIENT_ID=BOX_CLIENT_ID:latest,BOX_CLIENT_SECRET=BOX_CLIENT_SECRET:latest,BOX_SUBJECT_ID=BOX_SUBJECT_ID:latest"