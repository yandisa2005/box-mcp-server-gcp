name: Build and Deploy Box MCP Server to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggers from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to GCP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Authorize Docker for GCP Artifact Registry
      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # 5. Build and Push Container Image using Cloud Build
      - name: Build and Push Image
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mcp-repo/box-mcp-server:${{ github.sha }}"
          
          # Build and submit image to Artifact Registry
          gcloud builds submit --tag "$IMAGE_TAG" .
          
          # Pass image tag to next step
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 6. Deploy Container to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy box-mcp-server \
            --image "${{ env.IMAGE_TAG }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300s \
            --set-env-vars BOX_AUTH_TYPE=ccg,BOX_SUBJECT_TYPE=enterprise \
            --set-secrets \
              BOX_CLIENT_ID=BOX_CLIENT_ID:latest,\
              BOX_CLIENT_SECRET=BOX_CLIENT_SECRET:latest,\
              BOX_SUBJECT_ID=BOX_SUBJECT_ID:latest
